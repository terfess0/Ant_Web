<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntMaze - Dashboard Telemetría</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <header class="top-bar">
        <h1>📊 AntMaze Server Telemetry</h1>
        <div class="nav-links">
            <a href="/spectator">Espectador</a>
            <a href="/metrics" class="active">Telemetría</a>
        </div>
    </header>

    <div class="main-container metrics-container">
        <div class="card">
            <h3>Uso de CPU (%)</h3>
            <canvas id="cpuChart"></canvas>
        </div>
        <div class="card">
            <h3>Uso de Memoria (MB)</h3>
            <canvas id="memChart"></canvas>
        </div>
        <div class="card full-width">
            <h3>Hilos Activos: <span id="thread-count">0</span></h3>
            <ul id="thread-list" class="thread-list-ul"></ul>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/metrics.js') }}"></script>
</body>
</html>
