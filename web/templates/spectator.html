<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AntMaze - Espectador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ version }}">
    <!-- SocketIO, Firebase SDK v9 compat y Canvas Confetti -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .ranking-item {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.04);
            margin-bottom: 5px;
            padding: 7px 10px;
            border-radius: 4px;
            border-left: 3px solid var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .ranking-item.top1 {
            border-left-color: #d84315;
            background: rgba(216, 67, 21, 0.08);
            color: #d84315;
        }
        .firebase-section {
            margin-top: 15px;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <h1>🐜 AntMaze - Espectador</h1>
        <div class="nav-links">
            <a href="/spectator" class="active">Espectador</a>
            <a href="/player" style="background:var(--primary); color:white; padding:4px 10px; border-radius:4px; font-weight:bold;">Jugar</a>
            <a href="/metrics" style="opacity:0.6; font-size:0.8rem;">Telemetría</a>
        </div>
    </header>

    <div class="main-container">
        <div class="game-panel">
            <div id="status-banner" class="hidden">
                <h2 id="banner-text"></h2>
            </div>
            <canvas id="mazeCanvas" width="700" height="700"></canvas>
        </div>
        
        <div class="side-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:6px; margin-bottom:10px;">
                <h3 style="margin:0;">Ranking</h3>
                <button id="btn-reset-ranking" class="btn-reset-ranking" title="Limpiar ranking">Reset</button>
            </div>
            <ul id="ranking-list" style="list-style:none; padding:0; margin:0;">
                <!-- Lista de la ronda -->
            </ul>

            <div class="firebase-section">
                <h3 style="margin-top:0; font-size:1rem;">Ranking Histórico</h3>
                <div id="firebase-top5">
                    <!-- Top 5 dinámico -->
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/spectator.js') }}?v={{ version }}"></script>
</body>
</html>
